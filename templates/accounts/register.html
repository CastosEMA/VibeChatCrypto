{{template "base" .}}
{{define "title"}}Реєстрація — VibeChat{{end}}
{{define "body"}}
<div class="auth-page">
  <div class="auth-card fade-in">

    <div class="auth-logo">
      <div class="logo-icon">💬</div>
      <span class="logo-text">VibeChat P2P</span>
    </div>

    <h1 class="auth-title">Створіть свій ключ 🔑</h1>
    <p class="auth-subtitle">Ваш акаунт належатиме тільки вам</p>

    <form class="auth-form" id="register-form">
      <div id="register-error" class="form-error" style="display:none; text-align: center; justify-content: center; margin-bottom: 10px;">⚠️ Помилка</div>
      
      <div class="form-group">
        <label class="form-label" for="username">Нікнейм (Публічний)</label>
        <input type="text" name="username" id="username" class="form-input" placeholder="nickname" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Пароль (Для шифрування ключа)</label>
        <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">
        ✨ Згенерувати Ключі
      </button>
    </form>
    
    <div id="loading" style="display: none; text-align: center; margin-top: 20px;">
        <p style="color: var(--accent); font-weight: 600;">Генерація криптографії... ⏳</p>
    </div>

    <div class="auth-footer">
      Вже є файл-ключ? <a href="/accounts/login/">Увійти</a>
    </div>

  </div>
</div>
{{end}}
{{define "extra_js"}}
<script src="/static/js/crypto.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const loading = document.getElementById('loading');
    const errDiv = document.getElementById('register-error');
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    
    if(!username || password.length < 6) return;
    
    btn.style.display = 'none';
    loading.style.display = 'block';
    errDiv.style.display = 'none';
    
    try {
        // 1. Generate keys
        const keyPair = await window.VibeCrypto.generateKeypair();
        
        // 2. Export them
        const pubJwk = await window.VibeCrypto.exportPublicKey(keyPair);
        const privJwk = await window.VibeCrypto.exportPrivateKey(keyPair);
        
        // 3. Encrypt private key with password
        const encryptedPriv = await window.VibeCrypto.encryptPrivateKey(privJwk, password);
        
        // 4. Create the keystore bundle
        const keystore = {
            username: username,
            publicKey: pubJwk,
            encryptedPrivateKey: encryptedPriv,
            version: 1
        };
        
        // 5. Download the file
        const blob = new Blob([JSON.stringify(keystore, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${username}-vibechat-keys.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        // 6. Save keys to localStorage for the active session
        localStorage.setItem('vibe_username', username);
        localStorage.setItem('vibe_pubkey', JSON.stringify(pubJwk));
        localStorage.setItem('vibe_privkey', JSON.stringify(privJwk)); // raw in storage while logged in
        
        alert("Ваш ключ-файл завантажено! Збережіть його в надійному місці. Тепер ви будете перенаправлені в чат.");
        window.location.href = "/";
        
    } catch(err) {
        console.error(err);
        errDiv.innerText = "⚠️ Помилка генерації ключів";
        errDiv.style.display = 'flex';
        btn.style.display = 'block';
        loading.style.display = 'none';
    }
});
</script>
{{end}}
