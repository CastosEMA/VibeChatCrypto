{{define "base"}}<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}VibeChat{{end}}</title>
  <meta name="description" content="{{block "description" .}}Real-time чат з кімнатами, DM та реакціями{{end}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
  {{block "extra_css" .}}{{end}}
</head>
<body>

{{if .Flashes}}
<div class="messages-alerts">
  {{range .Flashes}}
    <div class="alert alert-{{.Tag}}">
      {{if eq .Tag "success"}}✅{{else if eq .Tag "error"}}❌{{else}}ℹ️{{end}}
      {{.Text}}
    </div>
  {{end}}
</div>
<script>
  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => {
      el.style.transition = 'opacity 0.4s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 400);
    });
  }, 3500);
</script>
{{end}}

{{block "body" .}}{{end}}

{{block "extra_js" .}}{{end}}
</body>
</html>
{{end}}
